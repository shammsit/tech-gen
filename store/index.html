<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Gen</title>

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="style.css">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  

    <h1 class="logo-text">Tech Gen</h1>

    <div class="header-actions">
        <a href="/about.html" class="icon-btn about-btn" title="About"></a>
        <a href="/contact.html" class="icon-btn contact-btn" title="Contact"></a>
    </div>
<div class="header-actions">



</div>
</header>
</header>
<button id="cartBtn" class="store-icon-btn">
<i class="fas fa-shopping-cart"></i>
<span id="cartCount">0</span>
</button>
<hr>


<!-- SEARCH -->

<section class="search-section">

<input
type="text"
placeholder="Search website package..."
id="search">

</section>

<!-- PRODUCTS -->

<section class="products">

<h2>Website Packages</h2>

<div class="store-product-grid" id="store-productGrid">

<!-- Product cards will come from JavaScript -->

</div>

</section>

<!-- CART SIDEBAR -->

<div class="cart-sidebar" id="cartSidebar">

<div class="cart-header">

<h2>Your Cart</h2>

<button id="closeCart">&times;</button>

</div>

<div id="cartItems"></div>

<div class="cart-footer">

<h3 id="totalPrice">₹0</h3>

<button class="checkout-btn">

Proceed to Checkout

</button>

</div>

</div>
<footer class="footer">

    <div class="footer-container">

        <div class="footer-left">
            <h3>TechGen</h3>
            <p>Building smart solutions with innovation 🚀</p>
        </div>

        <div class="footer-center">
            <p>© <span id="year"></span> TechGen</p>
            <p>
                Contact: 
                <a href="mailto:contact_us@techgen.online">
                    contact_us@techgen.online
                </a>
            </p>
        </div>

    

    </div>
<!-- LOGO -->
<section class="logo-section">
    <img src="../logo.png" alt="Tech Gen Logo">
</section>

</footer>
<script src="script.js"></script>
<script src="../script.js"></script>
</body>
</html>
